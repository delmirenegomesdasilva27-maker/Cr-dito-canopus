<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Credito Canopus</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="https://unpkg.com/html5-qrcode"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{background:#061f12;color:#f0fdf4;font-family:sans-serif}</style></head>
<body class="min-h-screen pb-24"><header class="bg-emerald-950 border-b border-emerald-500/30 p-4 sticky top-0 z-40"><div class="max-w-md mx-auto flex justify-between items-center"><div class="flex gap-2 items-center"><div class="bg-gradient-to-tr from-emerald-600 to-green-500 p-2 rounded-xl"><i class="fa-solid fa-leaf"></i></div><div><h1 class="font-bold">Credito Canopus 🌿</h1><p class="text-xs text-emerald-400">Valor Aberto Seguro</p></div></div><button onclick="trocarUsuario()" class="text-xs bg-emerald-900 border border-emerald-700 px-3 py-2 rounded-xl"><i class="fa-solid fa-user"></i> <span id="nome-usuario-atual">Mirene</span></button></div></header>
<main class="max-w-md mx-auto p-4 space-y-5"><div class="bg-emerald-900 border border-emerald-500/30 rounded-2xl p-6"><p class="text-emerald-300 text-xs font-bold uppercase">Saldo</p><div class="flex gap-1 mt-1"><span class="text-emerald-400 text-xl font-bold">R$</span><span id="saldo-display" class="text-4xl font-extrabold">0,00</span></div><div class="mt-4 pt-4 border-t border-emerald-800 flex justify-between text-xs"><span>Titular: <strong id="titular-nome">Mirene</strong></span><span class="text-emerald-400">Ativa</span></div></div>
<div class="flex bg-emerald-950 p-1 rounded-xl border border-emerald-800 text-sm"><button id="tab-pagar" onclick="mudarAba('pagar')" class="flex-1 py-2.5 rounded-lg bg-emerald-900 font-bold">Pagar</button><button id="tab-recargar" onclick="mudarAba('recargar')" class="flex-1 py-2.5 rounded-lg">Credito</button><button id="tab-receber" onclick="mudarAba('receber')" class="flex-1 py-2.5 rounded-lg">Cobrar</button></div>
<div id="conteudo-pagar"><div class="bg-emerald-950 border border-emerald-800 rounded-2xl p-5 text-center"><h2 class="font-semibold">Escanear QR</h2><div class="rounded-xl overflow-hidden bg-black border border-emerald-800 min-h-[200px] flex items-center justify-center mt-3"><div id="reader" class="w-full"></div><div id="reader-placeholder"><i class="fa-solid fa-qrcode text-4xl text-emerald-500/50"></i></div></div><button onclick="iniciarCamera()" class="w-full mt-4 bg-emerald-500 text-emerald-950 font-bold py-3 rounded-xl">Ativar Camera</button></div></div>
<div id="conteudo-recargar" class="hidden"><div class="bg-emerald-950 border border-emerald-800 rounded-2xl p-5 space-y-3 text-center"><h2 class="font-bold">Credito Valor Livre</h2><p class="text-xs text-emerald-400">Cliente escolhe quanto pagar</p><a href="https://link.mercadopago.com.br/dolarcanopus" target="_blank" class="block w-full bg-blue-500 text-white font-black py-4 rounded-xl">ESCOLHER VALOR E PAGAR NO MP</a><div class="bg-slate-950 border border-amber-500/30 p-4 rounded-xl text-left space-y-2"><p class="text-xs text-amber-200 font-bold">AREA DO DONO</p><input type="password" id="senha-dono" placeholder="Senha canopus123" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-center text-sm"><input type="number" id="valor-dono" placeholder="Valor que caiu ex: 7.50" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-center text-sm"><div class="grid grid-cols-2 gap-2"><button onclick="liberarCredito()" class="bg-amber-500 text-slate-900 font-bold py-3 rounded-xl text-sm">Liberar</button><button onclick="estornar()" class="bg-rose-900 border border-rose-700 text-rose-200 font-bold py-3 rounded-xl text-sm">Zerar</button></div></div></div></div>
<div id="conteudo-receber" class="hidden"><div class="bg-emerald-950 border border-emerald-800 rounded-2xl p-5"><h2 class="font-semibold">Cobrar Cliente</h2><input type="number" id="valor-cobranca" placeholder="Valor R$ 5.00" class="w-full bg-emerald-900 border border-emerald-800 rounded-xl p-3 text-white mt-3"><input type="text" id="desc-cobranca" placeholder="O que vende?" class="w-full bg-emerald-900 border border-emerald-800 rounded-xl p-3 text-white mt-2"><button onclick="gerarQR()" class="w-full bg-emerald-500 text-emerald-950 font-bold py-3 rounded-xl mt-3">Gerar QR</button><div id="box-qr" class="hidden mt-4 text-center"><div id="qr-code" class="flex justify-center p-3 bg-white rounded-2xl inline-block mx-auto"></div><p id="qr-titulo" class="text-xs mt-2"></p></div></div></div>
<div class="bg-emerald-950/40 border border-emerald-900 rounded-2xl p-5"><h3 class="text-sm font-semibold mb-3">Historico</h3><div id="lista-historico" class="space-y-2 text-xs"></div></div></main>
<div id="modal-confirmar" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50"><div class="bg-emerald-950 border border-emerald-500 rounded-2xl max-w-sm w-full p-6 text-center space-y-4"><h3 class="font-bold" id="modal-nome">Mercadinho</h3><p class="text-2xl font-black text-emerald-400" id="modal-valor">R$ 0,00</p><div class="flex gap-2"><button onclick="fecharModal()" class="flex-1 bg-emerald-900 py-2.5 rounded-xl text-xs">Cancelar</button><button onclick="confirmar()" class="flex-1 bg-emerald-500 text-emerald-950 py-2.5 rounded-xl text-xs font-bold">Confirmar</button></div></div></div>
<script>
let usuarioAtual=localStorage.getItem('canopus_user')||'Mirene';
let dadosApp=JSON.parse(localStorage.getItem('canopus_db_final'))||{usuarios:{}};
const SENHA_DONO='canopus123';
let html5QrCode=null,pendente=null;
if(!dadosApp.usuarios[usuarioAtual]) dadosApp.usuarios[usuarioAtual]={saldo:0,historico:[]};
function salvar(){localStorage.setItem('canopus_db_final',JSON.stringify(dadosApp));localStorage.setItem('canopus_user',usuarioAtual);}
function atualizar(){if(!dadosApp.usuarios[usuarioAtual]) dadosApp.usuarios[usuarioAtual]={saldo:0,historico:[]};let u=dadosApp.usuarios[usuarioAtual];document.getElementById('saldo-display').innerText=u.saldo.toFixed(2).replace('.',',');document.getElementById('titular-nome').innerText=usuarioAtual;document.getElementById('nome-usuario-atual').innerText=usuarioAtual;let lista=document.getElementById('lista-historico');if(u.historico.length==0)lista.innerHTML='<p class="text-emerald-700 text-center py-2">Nenhuma mov.</p>';else lista.innerHTML=u.historico.map(i=>`<div class="flex justify-between bg-emerald-900/40 p-2.5 rounded-xl border border-emerald-800"><span>${i.desc}</span><span class="${i.tipo=='entrada'?'text-emerald-400':'text-rose-400'}">${i.tipo=='entrada'?'+':'-'} R$ ${i.valor}</span></div>`).join('');}
window.onload=()=>atualizar();
function trocarUsuario(){let n=prompt('Nome:',usuarioAtual);if(n&&n.trim()!=''){usuarioAtual=n.trim();if(!dadosApp.usuarios[usuarioAtual]) dadosApp.usuarios[usuarioAtual]={saldo:0,historico:[]};salvar();atualizar();}}
function mudarAba(a){['pagar','recargar','receber'].forEach(x=>{document.getElementById('conteudo-'+x).classList.add('hidden');document.getElementById('tab-'+x).className='flex-1 py-2.5 rounded-lg';});document.getElementById('conteudo-'+a).classList.remove('hidden');document.getElementById('tab-'+a).className='flex-1 py-2.5 rounded-lg bg-emerald-900 font-bold';if(a!='pagar'&&html5QrCode&&html5QrCode.isScanning) html5QrCode.stop();}
function iniciarCamera(){document.getElementById('reader-placeholder').classList.add('hidden');html5QrCode=new Html5Qrcode('reader');html5QrCode.start({facingMode:'environment'},{fps:10,qrbox:200},t=>{try{let d=JSON.parse(t);if(d.valor){html5QrCode.stop();abrirModal(d.loja||'Mercadinho',parseFloat(d.valor));}}catch(e){}},()=>{});}
function abrirModal(loja,valor){pendente={loja,valor};document.getElementById('modal-nome').innerText=loja;document.getElementById('modal-valor').innerText='R$ '+valor.toFixed(2);document.getElementById('modal-confirmar').classList.remove('hidden');}
function fecharModal(){document.getElementById('modal-confirmar').classList.add('hidden');pendente=null;}
function confirmar(){if(!pendente)return;let u=dadosApp.usuarios[usuarioAtual];if(u.saldo<pendente.valor){alert('Saldo insuficiente');fecharModal();return;}u.saldo-=pendente.valor;u.historico.unshift({tipo:'saida',desc:pendente.loja,valor:pendente.valor,data:new Date().toLocaleString()});salvar();atualizar();fecharModal();alert('Pago!');}
function liberarCredito(){let s=document.getElementById('senha-dono').value;let v=parseFloat(document.getElementById('valor-dono').value);if(s!==SENHA_DONO){alert('Senha errada');return;}if(!v){alert('Valor?');return;}let u=dadosApp.usuarios[usuarioAtual];u.saldo+=v;u.historico.unshift({tipo:'entrada',desc:'Recarga MP',valor:v,data:new Date().toLocaleString()});salvar();atualizar();alert('Liberado R$ '+v+' para '+usuarioAtual);document.getElementById('valor-dono').value='';document.getElementById('senha-dono').value='';}
function estornar(){let s=document.getElementById('senha-dono').value;if(s!==SENHA_DONO){alert('Senha errada');return;}if(!confirm('Zerar saldo de '+usuarioAtual+'?'))return;let u=dadosApp.usuarios[usuarioAtual];u.saldo=0;u.historico=[];salvar();atualizar();alert('Zerado!');}
function gerarQR(){let v=parseFloat(document.getElementById('valor-cobranca').value);if(!v)return alert('Valor?');let desc=document.getElementById('desc-cobranca').value||'Compra';let payload=JSON.stringify({loja:'Mercadinho Canopus',desc:desc,valor:v});let c=document.getElementById('qr-code');c.innerHTML='';new QRCode(c,{text:payload,width:180,height:180});document.getElementById('qr-titulo').innerText='R$ '+v+' - '+desc;document.getElementById('box-qr').classList.remove('hidden');}
</script></body></html>
