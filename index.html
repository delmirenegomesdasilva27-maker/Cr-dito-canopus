<!DOCTYPE html><html lang=pt-BR><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>Crédito Canopus</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>
body{background:#001a12;color:#fff;font-family:system-ui;max-width:420px;margin:auto;padding:14px}
.card{background:#022c1f;border:1.5px solid #0a7a5a;border-radius:18px;padding:16px;margin-top:14px}
.btn{width:100%;padding:16px;border-radius:14px;border:none;font-weight:700;font-size:16px;cursor:pointer;display:flex;justify-content:center;gap:8px}
input{width:100%;padding:14px;border-radius:12px;border:1.5px solid #0a7a5a;background:#001a12;color:#fff;margin-top:10px;box-sizing:border-box;font-size:15px}
.titulo{font-size:17px;font-weight:800}
</style></head><body>
<div style=text-align:center;padding:8px 0><h2 style=margin:0;font-size:22px>🌿 Crédito Canopus</h2></div>

<div class="card" style=font-size:18px;font-weight:bold>Saldo: R$ <span id=saldoGeral>0,00</span><div id=nomeGrande style=font-size:18px;color:#6ee7b7;margin-top:6px;font-weight:800></div></div>

<div class=card>
<div style=font-size:14px;color:#6ee7b7;font-weight:bold>👧 Nome da criança</div>
<input id=nomeLogin placeholder="ex: joaozinho">
<button class=btn style=background:#fff;color:#000;margin-top:10px;font-size:15px onclick="entrar()">✅ Entrar</button>
</div>

<div class=card style=display:flex;flex-direction:column;gap:12px>
<button class=btn style=background:#10b981;color:#001a12 onclick="ver(1)">1 Pagar</button>
<button class=btn style=background:#fff;color:#000 onclick="ver(2)">2 Recarregar</button>
<button class=btn style=background:#fbbf24;color:#000 onclick="ver(3)">3 Dono</button>
</div>

<div id=a1 class=card>
<div class=titulo style=color:#10b981>1. Pagar no Mercadinho</div>
<input id=valorPagar type=number placeholder="Valor ex: 5">
<button class=btn style=background:#10b981;color:#001a12;margin-top:12px onclick="gerarQR()">Gerar QR Code</button>
<div id=qrcode style=display:flex;justify-content:center;margin-top:14px;background:#fff;padding:10px;border-radius:12px"></div>
<p id=msgQR style=text-align:center;font-size:13px;margin-top:8px;color:#6ee7b7></p>
<hr style=border-color:#0a5a44;margin:14px 0>
<input id=nomeDesconto placeholder="Nome ex: joaozinho">
<input id=valorDesconto type=number placeholder="Valor ex: 5">
<button class=btn style=background:#ef4444;color:#fff;margin-top:12px onclick="descontar()">Descontar do saldo</button>
</div>

<div id=a2 class=card style=display:none>
<div class=titulo>2. Recarregar</div>
<p style=font-size:14px;margin-top:6px>Link Mercado Pago valor livre</p>
<a href="https://link.mercadopago.com.br/dolarcanopus" target=_blank style=text-decoration:none>
<button class=btn style=background:#009ee3;color:#fff;margin-top:10px>💳 Mercado Pago - dolarcanopus</button>
</a>
</div>

<div id=a3 class=card style=display:none>
<div class=titulo style=color:#fbbf24>3. Área do Dono - Liberar</div>
<input id=nn placeholder="nome ex: joaozinho">
<input id=vv type=number placeholder="valor ex: 20">
<button class=btn style=background:#fbbf24;color:#000;margin-top:14px onclick="liberar()">✅ Liberar Crédito</button>
<p id=m3 style=text-align:center;font-weight:bold;font-size:15px;color:#fbbf24;margin-top:12px></p>
<div id=lista style=font-size:14px;line-height:24px;margin-top:10px"></div>
<button style=width:100%;margin-top:14px;background:#000;color:#f88;border:none;padding:10px;border-radius:10px;font-size:12px" onclick="if(confirm('Apagar tudo?')){localStorage.clear();location.reload()}">apagar tudo</button>
</div>

<script>
let saldos={};try{saldos=JSON.parse(localStorage.getItem('s')||'{}')}catch(e){}
let nomeAtual=localStorage.getItem('tit')||'';
function upd(){let t=0;for(let k in saldos)t+=saldos[k];document.getElementById('saldoGeral').innerText=t.toFixed(2).replace('.',',');if(nomeAtual){document.getElementById('nomeGrande').innerText='👧 '+nomeAtual+' - R$ '+(saldos[nomeAtual.toLowerCase()]||0).toFixed(2);}let l=document.getElementById('lista');l.innerHTML='';for(let k in saldos)l.innerHTML+='• '+k+': R$ '+saldos[k].toFixed(2)+'<br>';localStorage.setItem('s',JSON.stringify(saldos));}
function entrar(){let n=document.getElementById('nomeLogin').value.trim().toLowerCase();if(!n){alert('Digite nome');return}nomeAtual=n;localStorage.setItem('tit',n);upd();ver(1);document.getElementById('nomeLogin').value='';}
function ver(n){document.getElementById('a1').style.display=n==1?'block':'none';document.getElementById('a2').style.display=n==2?'block':'none';document.getElementById('a3').style.display=n==3?'block':'none';}
function liberar(){let n=document.getElementById('nn').value.trim().toLowerCase();let v=parseFloat(document.getElementById('vv').value);if(!n||!v){alert('Preenche');return}saldos[n]=(saldos[n]||0)+v;document.getElementById('m3').innerText='Liberado R$ '+v+' pra '+n;document.getElementById('nn').value='';document.getElementById('vv').value='';upd();}
