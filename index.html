<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>Canopus FIX</title><style>body{background:#001f17;color:#fff;font-family:sans-serif;max-width:400px;margin:auto;padding:10px}button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;margin-top:8px;font-size:15px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #10b981;background:#003322;color:#fff;margin-top:8px;box-sizing:border-box}.card{background:#002e22;padding:14px;border-radius:14px;margin-top:12px;border:1px solid #065f46}.tab{display:flex;gap:6px}</style></head><body>
<h3 style=text-align:center>🌿 Crédito Canopus FIX</h3>
<div class=card>Saldo: R$ <span id=saldo>0,00</span> <small id=nome></small></div>
<div class="tab card"><button id=bb1 onclick="ver(1)" style=background:#10b981>1 Pagar</button><button id=bb2 onclick="ver(2)" style=background:#fff;color:#000>2 Recarregar</button><button id=bb3 onclick="ver(3)" style=background:#fbbf24;color:#000>3 Dono</button></div>
<div id=a1 class=card><b>1. Escanear QR</b><p id=m1 style=font-size:13px>QR do mercadinho aqui</p><button onclick="alert('QR vai aqui depois, primeiro testa o Dono')" style=background:#10b981>📷 Câmera</button></div>
<div id=a2 class=card style=display:none><b>2. Comprar Crédito</b><a href="https://link.mercadopago.com.br/dolarcanopus" target=_blank><button style=background:#0ea5e9;color:#fff>💳 Pagar Mercado Pago</button></a><p style=font-size:12px;margin-top:8px>Peça pro pai mandar comprovante no Zap com nome do filho</p></div>
<div id=a3 class=card style=display:none><b style=color:#fbbf24>3. DONO - Liberar</b><input id=nn placeholder="nome ex: joaozinho"><input id=vv type=number placeholder="valor ex: 20"><button onclick="lib()" style=background:#fbbf24;color:#000>✅ LIBERAR AGORA</button><p id=m3 style=font-size:13px;color:#fbbf24></p><div id=lista style=font-size:12px;margin-top:10px></div></div>
<script>
let saldos={};try{saldos=JSON.parse(localStorage.getItem('s')||'{}')}catch(e){};let tit=localStorage.getItem('tit')||'';
function upd(){let tot=0;for(let k in saldos){tot+=saldos[k]}document.getElementById('saldo').innerText=tot.toFixed(2).replace('.',',');document.getElementById('nome').innerText=tit?' - '+tit:'';let l=document.getElementById('lista');l.innerHTML='Saldos:<br>';for(let k in saldos){l.innerHTML+=k+': R$ '+saldos[k]+'<br>'}}
function ver(n){document.getElementById('a1').style.display=n==1?'block':'none';document.getElementById('a2').style.display=n==2?'block':'none';document.getElementById('a3').style.display=n==3?'block':'none';}
function lib(){let n=document.getElementById('nn').value.trim().toLowerCase();let v=parseFloat(document.getElementById('vv').value);if(!n){alert('digita o nome');return}if(!v){alert('digita o valor');return}saldos[n]=(saldos[n]||0)+v;localStorage.setItem('s',JSON.stringify(saldos));document.getElementById('m3').innerText='✅ Liberado R$ '+v+' pra '+n+'!';document.getElementById('nn').value='';document.getElementById('vv').value='';upd();ver(1);}
upd();ver(1);
</script></body></html>
